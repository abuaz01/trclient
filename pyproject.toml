[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "trclient"
version = "0.2.0"
description = "Unofficial Trade Republic API client and local MCP server: web login, orders with guardrails, documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "trclient contributors" }]
dependencies = [
    "httpx>=0.27",
    "websockets>=13.0",
    "keyring>=25.0",
    "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
trclient = "trclient.cli:main"
trclient-mcp = "trclient.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trclient"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
